[build-system]
requires = ["setuptools>=80", "setuptools-scm>=9.2"]
build-backend = "setuptools.build_meta"

[project]
name = "usb_multimeter"
dynamic = ["version"]
description = "Data logger for JT-UM120, FNIRSI FNB48, FNIRSI C1 and FNIRSI FNB58 USB power meters"
readme = "README.md"
requires-python = ">=3.12"

classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

license = "MIT"
license-files = ["LICEN[CS]E*"]

dependencies = [
    "crc==5.0.0",
    "pyusb==1.3.1",
    "ruamel.yaml==0.18.10",
    "timelength==3.0.2",
]

[project.optional-dependencies]
dev = [
    "pylint==3.3.0",
    "build==1.4.0",
    "twine==6.2.0",
]

[project.scripts]
usb_logger = "usb_multimeter.app.cli:app"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.in"] }
optional-dependencies.test = { file = ["requirements-test.txt"] }

[project.urls]
Homepage = "https://github.com/rsfzi/JT-UM120-usb-power-data-logger"
Repository = "https://github.com/rsfzi/JT-UM120-usb-power-data-logger"

[tool.setuptools_scm]
version_file = "src/usb_multimeter/_version.py"

